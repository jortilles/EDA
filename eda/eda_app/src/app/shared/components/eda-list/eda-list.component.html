<div class="border rounded-md">
  <div class="border rounded-lg overflow-hidden">
    <table class="w-full">
      <thead class="bg-gray-100">
        <tr class="border border-gray-300 p-2 bg-gray-200">
          @for (column of columns; track column) { 
            <ng-container *ngTemplateOutlet="columnTemplates.get(column.key); context: { isHeader: true }"></ng-container>
          }
        </tr>
      </thead>
      <tbody class="font-semibold">
        @for (row of rows; track row) {
          <tr>
            @for (column of columns; track column) {
              <td class="border border-gray-300 p-2">
                <ng-container *ngTemplateOutlet="columnTemplates.get(column.key); context: { row: row, isHeader: false }"></ng-container>
              </td>
            }
          </tr>
        }
      </tbody>
    </table>
  </div>
  
  <div class="flex items-center justify-between p-2 border-t bg-muted/20">
    <div class="flex items-center space-x-1">
      <button class="inline-flex items-center justify-center whitespace-nowrap rounded-md text-sm font-medium ring-offset-background transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2 disabled:pointer-events-none disabled:opacity-50 border border-input bg-background hover:bg-accent hover:text-accent-foreground h-9 w-9 p-0" disabled>
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-4 w-4"><path d="M11 17l-5-5 5-5"/><path d="M17 17l-5-5 5-5"/></svg>
      </button>
      <button class="inline-flex items-center justify-center whitespace-nowrap rounded-md text-sm font-medium ring-offset-background transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2 disabled:pointer-events-none disabled:opacity-50 border border-input bg-background hover:bg-accent hover:text-accent-foreground h-9 w-9 p-0" disabled>
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-4 w-4"><path d="m15 18-6-6 6-6"/></svg>
      </button>
      <span class="inline-flex items-center justify-center rounded-md text-sm font-medium bg-primary/10 border border-primary/20 px-2.5 py-0.5">1</span>
      <button class="inline-flex items-center justify-center whitespace-nowrap rounded-md text-sm font-medium ring-offset-background transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2 disabled:pointer-events-none disabled:opacity-50 border border-input bg-background hover:bg-accent hover:text-accent-foreground h-9 w-9 p-0" disabled>
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-4 w-4"><path d="m9 18 6-6-6-6"/></svg>
      </button>
      <button class="inline-flex items-center justify-center whitespace-nowrap rounded-md text-sm font-medium ring-offset-background transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2 disabled:pointer-events-none disabled:opacity-50 border border-input bg-background hover:bg-accent hover:text-accent-foreground h-9 w-9 p-0" disabled>
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-4 w-4"><path d="m13 17 5-5-5-5"/><path d="m7 17 5-5-5-5"/></svg>
      </button>
    </div>
    <div class="text-sm text-muted-foreground">
      2 registros
    </div>
  </div>
</div>
