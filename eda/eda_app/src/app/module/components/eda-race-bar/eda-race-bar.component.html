<div class="eda-race-bar-wrapper">
  @if (!noData) {
    <div class="eda-race-bar-header">
      <button type="button" class="eda-race-bar-play-btn" (click)="togglePlay()" [attr.aria-label]="playing ? 'Pausa' : 'Reproducir'">
        <span class="material-icons">{{ playing ? 'pause' : (finished ? 'replay' : 'play_arrow') }}</span>
      </button>
    </div>
    <div #edad3container class="svg-container">
      <svg #svgContainer class="svg-content" [id]="id" width="100%" height="100%"></svg>
      <div class="eda-race-bar-ticker" [style.font-size.px]="tickerFontSizePx">{{ periodLabel }}</div>
    </div>
    @if (inject.showTimeline && frameCount > 1) {
      <div class="eda-race-bar-timeline">
        <span class="eda-race-bar-timeline-edge">{{ firstPeriodLabel }}</span>
        <input type="range" class="eda-race-bar-timeline-input" min="0" [max]="frameCount - 1" step="1"
          [value]="scrubPosition" (input)="onScrub($event)" [attr.aria-label]="'Timeline'">
        <span class="eda-race-bar-timeline-edge">{{ lastPeriodLabel }}</span>
      </div>
    }
    @if (chartLegend) {
      <eda-chart-legend [items]="legendItems" (toggle)="toggleLegend($event)"></eda-chart-legend>
    }
  } @else {
    <div class="eda-race-bar-no-data" i18n="@@raceBarNoData">No hay suficientes datos temporales para animar este gráfico.</div>
  }
</div>
