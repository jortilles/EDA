<div class="relative w-full h-full">
  <svg #svgMap class="ds-map-svg w-full h-full"></svg>

  @if (!tables.length) {
    <div class="absolute inset-0 flex items-center justify-center text-sm text-muted-foreground pointer-events-none"
      i18n="@@dsMapEmpty">El modelo de datos no tiene tablas</div>
  }

  <div class="absolute top-2 right-2 flex gap-1 rounded-md border bg-background p-0.5 shadow-sm">
    <button type="button" class="p-1.5 rounded-md hover:bg-muted" [pTooltip]="modelPropsSTR" tooltipPosition="bottom" (click)="selectModel()">
      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"></circle>
        <line x1="12" y1="16" x2="12" y2="12"></line>
        <line x1="12" y1="8" x2="12.01" y2="8"></line>
      </svg>
    </button>
    <button type="button" class="p-1.5 rounded-md hover:bg-muted" [pTooltip]="fitSTR" tooltipPosition="bottom" (click)="fitToView()">
      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M8 3H5a2 2 0 0 0-2 2v3"></path>
        <path d="M21 8V5a2 2 0 0 0-2-2h-3"></path>
        <path d="M3 16v3a2 2 0 0 0 2 2h3"></path>
        <path d="M16 21h3a2 2 0 0 0 2-2v-3"></path>
      </svg>
    </button>
    <button type="button" class="p-1.5 rounded-md hover:bg-muted" [pTooltip]="relayoutSTR" tooltipPosition="bottom" (click)="relayout()">
      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="3" width="7" height="7" rx="1"></rect>
        <rect x="14" y="3" width="7" height="7" rx="1"></rect>
        <rect x="14" y="14" width="7" height="7" rx="1"></rect>
        <rect x="3" y="14" width="7" height="7" rx="1"></rect>
      </svg>
    </button>
  </div>
</div>
